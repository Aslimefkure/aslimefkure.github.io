    :root { color-scheme: dark; }
    body { margin: 0; background: #000; }
    main {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, min(35vw, 440px)) minmax(0, min(50vw, 650px));
      place-content: center;
      align-items: center;
      gap: clamp(12px, 3.6vw, 64px);
      padding-inline: clamp(12px, 3vw, 36px);
      overflow: hidden;
    }
    .portrait {
      position: relative;
      height: 94vh;
      height: 94dvh;
    }
    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform: translateX(2%);
      filter: grayscale(1) brightness(.9) sepia(1) saturate(2.8) hue-rotate(131deg);
    }
    .poem {
      z-index: 1;
      margin: 0;
      color: #e3eeee;
      font: clamp(18px, min(2.42vw, 7vh), 34px)/1.23 "Crimson Text", Georgia, serif;
      pointer-events: none;
    }
    .poem p { margin: 0; }
    .poem .intro { margin-bottom: .87em; color: #a5ceca; font-size: .78em; }
    .poem-line { display: block; }
    .poem-line + .poem-line { margin-top: .19em; }
    [data-rendering] .poem { opacity: var(--poem-opacity, 1); }
    [data-rendering] .poem-line { opacity: var(--verse-opacity, 0); }
    [data-rendering] img {
      position: absolute;
      width: 1px;
      height: 1px;
      clip-path: inset(50%);
    }
    button {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      touch-action: manipulation;
    }
    button:enabled { cursor: pointer; }
    button:focus-visible { outline: 2px solid #91eded; outline-offset: -4px; }
    canvas { display: block; width: 100%; height: 100%; }
    @media (max-width: 850px) and (orientation: portrait), (max-width: 420px) {
      main {
        grid-template-columns: minmax(0, 510px);
        grid-template-rows: minmax(0, 1fr) auto;
        align-items: stretch;
        gap: clamp(6px, 1.3vh, 14px);
        padding: max(12px, env(safe-area-inset-top)) clamp(14px, 4vw, 30px)
          max(22px, env(safe-area-inset-bottom));
      }
      .portrait { height: auto; }
      .poem { font-size: clamp(15px, 4.72vw, 26px); text-align: center; }
      .poem .intro { margin-bottom: .65em; }
    }

    <blockquote class="poem">
      <p class="intro poem-line">Hani diyor ya Özdemir Asaf…</p>
      <p>
        <span class="poem-line">İmkânsızları yaşamak mıdır sevmek,</span>
        <span class="poem-line">yoksa severken imkânsız mıdır yaşayabilmek?</span>
        <span class="poem-line">Zor mudur gözlerine bakarken sevgiyi görmek,</span>
        <span class="poem-line">yoksa sevgi midir gözlerindeki tek gerçek?</span>
      </p>
    </blockquote>

  <script>
    (() => {
      const stage = document.querySelector('main');
      const portraitFrame = stage.querySelector('.portrait');
      const portrait = stage.querySelector('img');
      const poem = stage.querySelector('.poem');
      const replay = stage.querySelector('button');
      const canvas = stage.querySelector('canvas');
      const display = canvas.getContext('2d');
      if (!display || typeof Path2D !== 'function' || typeof portrait.decode !== 'function') return;

      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const outlineStart = 1650;
      const outlineEnd = 5200;
      const colorStart = 4950;
      const duration = 7000;
      const wordTravel = 1750;
      const verses = [...poem.querySelectorAll('.poem-line')].map((element, index) => ({
        element,
        begin: 4620 + index * 800,
        points: [],
        opacity: 0,
      }));
      const assembled = verses[verses.length - 1].begin + wordTravel;
      const fadeStart = assembled + 5400;
      const fadeDuration = 1200;
      const cycleDuration = fadeStart + fadeDuration;
      const clamp = value => Math.max(0, Math.min(1, value));
      const blend = (from, to, amount) => from + (to - from) * amount;
      const smooth = value => value * value * (3 - 2 * value);

      stage.dataset.rendering = '';
      const font = document.fonts?.load('24px "Crimson Text"', poem.textContent).catch(() => []);
      Promise.all([portrait.decode(), font]).then(initialize).catch(() => {
        delete stage.dataset.rendering;
        replay.hidden = true;
      });

      function initialize() {
        const width = 600;
        const height = Math.round(width * portrait.naturalHeight / portrait.naturalWidth);
        const makeLayer = options => {
          const layer = document.createElement('canvas');
          layer.width = width;
          layer.height = height;
          return layer.getContext('2d', options);
        };

        const buffer = makeLayer({ willReadFrequently: true });
        const ink = makeLayer();
        const pigment = makeLayer();
        const lettering = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
        buffer.drawImage(portrait, 0, 0, width, height);
        const source = buffer.getImageData(0, 0, width, height).data;
        const tones = new Uint8Array(width * height);
        const outlines = ink.createImageData(width, height);
        const colors = pigment.createImageData(width, height);

        for (let pixel = 0; pixel < tones.length; pixel++) {
          const channel = pixel * 4;
          const alpha = source[channel + 3] / 255;
          tones[pixel] = (source[channel] * .2126 + source[channel + 1] * .7152 +
            source[channel + 2] * .0722) * alpha;
        }

        const shadow = [2, 13, 21];
        const turquoise = [21, 208, 183];
        const blue = [40, 124, 234];
        const paleTurquoise = [178, 249, 227];
        const paleBlue = [153, 212, 255];

        for (let y = 2; y < height - 2; y++) {
          for (let x = 2; x < width - 2; x++) {
            const pixel = y * width + x;
            const offset = pixel * 4;
            const alpha = source[offset + 3];
            if (alpha < 12) continue;

            const fineEdge = Math.max(Math.abs(tones[pixel - 1] - tones[pixel + 1]),
              Math.abs(tones[pixel - width] - tones[pixel + width]));
            const wideEdge = Math.max(Math.abs(tones[pixel - 2] - tones[pixel + 2]),
              Math.abs(tones[pixel - width * 2] - tones[pixel + width * 2]));
            const sideEdge = alpha - Math.min(source[offset - 8 + 3], source[offset + 8 + 3],
              source[offset - width * 8 + 3], source[offset + width * 8 + 3]);
            const strength = Math.max(0, (fineEdge - 4) * 4, (wideEdge - 7) * 2.6, sideEdge * .78);
            outlines.data[offset] = 197;
            outlines.data[offset + 1] = 221;
            outlines.data[offset + 2] = 237;
            outlines.data[offset + 3] = Math.min(alpha, strength, 238);

            const hue = clamp(y / height * .96 + (x / width - .5) * .86 - .10);
            const value = Math.pow(clamp(tones[pixel] / alpha), .73);
            const mids = clamp(value / .84);
            const light = smooth(clamp((value - .80) / .20)) * .72;
            for (let channel = 0; channel < 3; channel++) {
              const mid = blend(turquoise[channel], blue[channel], hue);
              const highlight = blend(paleTurquoise[channel], paleBlue[channel], hue);
              colors.data[offset + channel] = blend(blend(shadow[channel], mid, mids), highlight, light);
            }
            colors.data[offset + 3] = alpha;
          }
        }

        ink.putImageData(outlines, 0, 0);
        pigment.putImageData(colors, 0, 0);

        let seed = 8131;
        function random() {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        }

        const points = [];
        for (let top = 0; top < height - 4; top += 4) {
          for (let left = 0; left < width - 4; left += 4) {
            const x = left + Math.floor(random() * 4);
            const y = top + Math.floor(random() * 4);
            const pixel = (y * width + x) * 4;
            const chance = outlines.data[pixel + 3] / 255;
            if (random() > chance * .92) continue;
            const sweep = clamp(y / height + (x / width - .5) * .14 + (random() - .5) * .043);
            const arrive = blend(1950, outlineEnd, sweep);
            const appear = Math.max(0, arrive - blend(1850, 2950, random()));
            points.push({
              x, y, arrive, appear,
              offsetX: blend(-.29, .29, random()),
              offsetY: blend(-105, 135, random()),
              arc: (random() - .5) * 41,
              size: .8 + random() * 2.1,
              bright: random() < .20,
            });
          }
        }

        let screenWidth, screenHeight, artWidth, artHeight, left, top;
        let elapsed = 0;
        let frame = 0;
        let start;

        function reveal(layer, progress, feather) {
          if (progress >= 1) {
            display.drawImage(layer, left, top, artWidth, artHeight);
            return;
          }
          if (progress <= 0) return;

          buffer.clearRect(0, 0, width, height);
          buffer.drawImage(layer, 0, 0);
          const head = clamp(progress * (1 + feather) - feather * .23);
          const mask = buffer.createLinearGradient(width * .46, 0, width * .69, height);
          mask.addColorStop(0, '#fff');
          mask.addColorStop(clamp(head - feather), '#fff');
          mask.addColorStop(head, '#ffffff00');
          mask.addColorStop(1, '#ffffff00');
          buffer.globalCompositeOperation = 'destination-in';
          buffer.fillStyle = mask;
          buffer.fillRect(0, 0, width, height);
          buffer.globalCompositeOperation = 'source-over';
          display.drawImage(buffer.canvas, left, top, artWidth, artHeight);
        }

        function drawPoints() {
          const scale = artHeight / height;
          const luminous = new Path2D();
          const silver = new Path2D();
          const dim = new Path2D();
          for (const point of points) {
            if (elapsed < point.appear || elapsed >= point.arrive + 430) continue;
            const travel = clamp((elapsed - point.appear) / (point.arrive - point.appear));
            const remaining = 1 - smooth(travel);
            const entrance = smooth(clamp((elapsed - point.appear) / 620));
            const settle = smooth(clamp((elapsed - point.arrive) / 430));
            const brightness = (.24 + entrance * .76) * (1 - settle);
            const size = Math.max(.5, point.size * scale) * brightness;
            const targetX = left + point.x * scale;
            const startX = clamp(targetX / screenWidth + point.offsetX) * screenWidth;
            const x = blend(targetX, startX, remaining) + Math.sin(travel * Math.PI) * point.arc * scale;
            const y = top + (point.y + point.offsetY * remaining) * scale;
            const path = point.bright && travel > .69 && brightness > .64 ? luminous :
              brightness > .52 ? silver : dim;
            path.rect(x - size / 2, y - size / 2, size, size);
          }
          display.fillStyle = '#92bbd271';
          display.fill(dim);
          display.fillStyle = '#c3e2f2bd';
          display.fill(silver);
          display.shadowBlur = 6 * Math.max(.7, scale);
          display.shadowColor = '#81dcff';
          display.fillStyle = '#ebfcff';
          display.fill(luminous);
          display.shadowBlur = 0;
        }

        function measureVerses(bounds) {
          if (!lettering) return;
          for (const verse of verses) {
            const { element } = verse;
            const area = element.getBoundingClientRect();
            const style = getComputedStyle(element);
            const text = element.firstChild;
            const rows = [];
            const range = document.createRange();
            for (const word of text.data.matchAll(/\S+/gu)) {
              const end = word.index + word[0].length;
              range.setStart(text, word.index);
              range.setEnd(text, end);
              const box = range.getBoundingClientRect();
              const row = rows[rows.length - 1];
              if (row && Math.abs(row.top - box.top) < 1) {
                row.end = end;
              } else {
                rows.push({ start: word.index, end, left: box.left, top: box.top });
              }
            }

            const mask = lettering.canvas;
            mask.width = Math.max(1, Math.ceil(area.width) + 4);
            mask.height = Math.max(1, Math.ceil(area.height) + 4);
            lettering.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
            lettering.fillStyle = '#fff';
            const fontSize = parseFloat(style.fontSize);
            const lineHeight = parseFloat(style.lineHeight);
            const metrics = lettering.measureText('Hmg');
            const baseline = (lineHeight + (metrics.fontBoundingBoxAscent ?? fontSize * .8)
              - (metrics.fontBoundingBoxDescent ?? fontSize * .2)) / 2;
            rows.forEach((row, index) => {
              lettering.fillText(text.data.slice(row.start, row.end), row.left - area.left + 2,
                2 + baseline + index * lineHeight);
            });

            const pixels = lettering.getImageData(0, 0, mask.width, mask.height).data;
            const step = fontSize >= 28 ? 3 : 2;
            verse.points = [];
            for (let y = 0; y < mask.height; y += step) {
              for (let x = 0; x < mask.width; x += step) {
                if (pixels[(y * mask.width + x) * 4 + 3] < 115) continue;
                verse.points.push({
                  x: area.left - bounds.left + x - 2,
                  y: area.top - bounds.top + y - 2,
                  dx: blend(-54, 58, random()),
                  dy: blend(-27, 33, random()),
                  delay: x / mask.width * .26 + random() * .14,
                  size: blend(.65, 1.55, random()),
                });
              }
            }
          }
        }

        function drawVerses() {
          for (const verse of verses) {
            const phase = clamp((elapsed - verse.begin) / wordTravel);
            const opacity = smooth(clamp((phase - .68) / .32));
            if (opacity !== verse.opacity) {
              verse.opacity = opacity;
              verse.element.style.setProperty('--verse-opacity', opacity);
            }
            if (phase <= 0 || phase >= 1) continue;

            const path = new Path2D();
            for (const point of verse.points) {
              const travel = clamp((phase - point.delay) / (1 - point.delay));
              if (travel <= 0) continue;
              const remaining = 1 - smooth(travel);
              const x = point.x + point.dx * remaining;
              const y = point.y + point.dy * remaining;
              const size = point.size * (.4 + .6 * clamp(travel * 4));
              path.rect(x - size / 2, y - size / 2, size, size);
            }
            display.globalAlpha = (1 - opacity) * .89;
            display.fillStyle = '#d5edf2';
            display.fill(path);
            display.globalAlpha = 1;
          }
        }

        let sceneOpacity = 1;
        function paint() {
          display.clearRect(0, 0, screenWidth, screenHeight);
          const opacity = 1 - smooth(clamp((elapsed - fadeStart) / fadeDuration));
          if (sceneOpacity !== opacity) {
            sceneOpacity = opacity;
            poem.style.setProperty('--poem-opacity', opacity);
          }
          if (elapsed >= duration) {
            display.globalAlpha = opacity;
            display.drawImage(pigment.canvas, left, top, artWidth, artHeight);
            display.globalAlpha = 1;
          } else {
            const lines = clamp((elapsed - outlineStart) / (outlineEnd - outlineStart));
            reveal(ink.canvas, lines, .13);
            const color = clamp((elapsed - colorStart) / (duration - colorStart));
            reveal(pigment.canvas, smooth(color), .25);
            if (elapsed < outlineEnd + 430) drawPoints();
          }
          drawVerses();
        }

        function resize() {
          const bounds = stage.getBoundingClientRect();
          const art = portraitFrame.getBoundingClientRect();
          screenWidth = Math.max(1, bounds.width);
          screenHeight = Math.max(1, bounds.height);
          const ratio = Math.min(devicePixelRatio || 1, 2, 2880 / screenWidth, 2160 / screenHeight);
          canvas.width = Math.round(screenWidth * ratio);
          canvas.height = Math.round(screenHeight * ratio);
          display.setTransform(canvas.width / screenWidth, 0, 0, canvas.height / screenHeight, 0, 0);
          display.imageSmoothingQuality = 'high';
          artHeight = Math.max(0, Math.min(art.height, art.width * height / width));
          artWidth = artHeight * width / height;
          left = art.left - bounds.left + (art.width - artWidth) / 2 + artWidth * .02;
          top = art.top - bounds.top + (art.height - artHeight) / 2;
          measureVerses(bounds);
          paint();
        }

        function tick(now) {
          start ??= now;
          const time = (now - start) % cycleDuration;
          const next = time >= assembled && time <= fadeStart ? assembled : time;
          if (next !== elapsed) {
            elapsed = next;
            paint();
          }
          frame = requestAnimationFrame(tick);
        }

        function play() {
          cancelAnimationFrame(frame);
          replay.disabled = motion.matches;
          start = undefined;
          elapsed = motion.matches ? assembled : 0;
          paint();
          frame = motion.matches ? 0 : requestAnimationFrame(tick);
        }

        function updateMotion() {
          if (motion.matches || document.hidden) {
            cancelAnimationFrame(frame);
            frame = 0;
            start = undefined;
            elapsed = assembled;
            replay.disabled = motion.matches;
            paint();
            return;
          }
          play();
        }

        replay.hidden = false;
        resize();
        updateMotion();
        replay.addEventListener('click', play);
        window.addEventListener('resize', resize);
        motion.addEventListener('change', updateMotion);
        document.addEventListener('visibilitychange', updateMotion);
      }
    })();
  </script>
</body>
</html>
